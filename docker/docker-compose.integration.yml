name: luxury-perfume-integration

services:
  integration-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: luxury_perfume_test
      POSTGRES_USER: luxury_perfume_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxury_perfume_test -d luxury_perfume_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  integration-redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
