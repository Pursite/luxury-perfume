[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = tests.py test_*.py *_tests.py
testpaths = apps config tests
addopts =
    -ra
    --strict-config
    --strict-markers
    -m "not integration"
    --cov=apps
    --cov=config
    --cov-branch
    --cov-config=.coveragerc
    --cov-report=term-missing
    --cov-fail-under=85
markers =
    integration: requires PostgreSQL and Redis integration services
