name: Test suite

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: React storefront
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node 24 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend source
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build production storefront
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://shop.exonplus.ir
        run: npm run build

      - name: Stamp and validate frontend release
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: bash scripts/frontend-release.sh stamp frontend/dist "$COMMIT_SHA"

      - name: Build and export frontend image
        env:
          COMMIT_SHA: ${{ github.sha }}
          IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          docker build \
            --file docker/Dockerfile.frontend \
            --label "org.opencontainers.image.source=$IMAGE_SOURCE" \
            --label "org.opencontainers.image.revision=$COMMIT_SHA" \
            --tag luxury-perfume-frontend:application \
            frontend/dist
          docker image save \
            --output /tmp/luxury-perfume-frontend-application.tar \
            luxury-perfume-frontend:application

      - name: Upload frontend image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: luxury-perfume-frontend-image-${{ github.sha }}
          path: /tmp/luxury-perfume-frontend-application.tar
          if-no-files-found: error
          retention-days: 1

  default-tests:
    name: SQLite and LocMem
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/requirements.txt
            requirements/requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements/requirements-test.txt

      - name: Run pytest with branch coverage and warnings as errors
        run: python -W error -m pytest

      - name: Lint Python source
        run: python -m ruff check apps config tests

      - name: Run static security checks
        run: python -m bandit -q -r apps config -x 'apps/**/tests/**,config/tests/**'

      - name: Run Django system checks
        run: python manage.py check --settings=config.settings.test

      - name: Check for missing migrations
        run: >-
          python manage.py makemigrations --check --dry-run
          --settings=config.settings.test

  integration-tests:
    name: PostgreSQL and Redis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: luxury_perfume_test
          POSTGRES_USER: luxury_perfume_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luxury_perfume_test -d luxury_perfume_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DJANGO_SETTINGS_MODULE: config.settings.integration
      INTEGRATION_DB_NAME: luxury_perfume_test
      INTEGRATION_DB_USER: luxury_perfume_test
      INTEGRATION_DB_HOST: 127.0.0.1
      INTEGRATION_DB_PORT: "5432"
      INTEGRATION_CACHE_REDIS_URL: redis://127.0.0.1:6379/14
      INTEGRATION_SECURITY_REDIS_URL: redis://127.0.0.1:6379/15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/requirements.txt
            requirements/requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements/requirements-test.txt

      - name: Run PostgreSQL and Redis integration tests
        run: >-
          python -m pytest
          -o addopts="--strict-config --strict-markers"
          -m integration
          --ds=config.settings.integration
          -q

      - name: Run Django system checks against PostgreSQL
        run: python manage.py check --settings=config.settings.integration

      - name: Check migrations against PostgreSQL
        run: >-
          python manage.py makemigrations --check --dry-run
          --settings=config.settings.integration

  image:
    name: Application image
    needs: [default-tests, integration-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Prepare production Compose environment
        run: cp docker/env/.env.production.example .env

      - name: Validate production Compose configuration
        env:
          APP_IMAGE: ghcr.io/pursite/luxury-perfume:compose-validation
        run: >-
          docker compose --env-file .env
          -f docker/docker-compose.yml
          -f docker/docker-compose.prod.yml
          config -q

      - name: Build and export application image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          target: final
          tags: luxury-perfume:application
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: false
          outputs: type=docker,dest=/tmp/luxury-perfume-application.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload application image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: luxury-perfume-image-${{ github.sha }}
          path: /tmp/luxury-perfume-application.tar
          if-no-files-found: error
          retention-days: 1

  release-gate:
    name: Release gate
    needs: [frontend, default-tests, integration-tests, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Confirm complete release gate
        run: echo "complete release gate passed"

  publish:
    name: Publish application image
    needs: [release-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ghcr-publish-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject an existing application image tag
        env:
          IMAGE_TAG: ghcr.io/pursite/luxury-perfume:${{ github.sha }}
        run: |
          if docker buildx imagetools inspect "$IMAGE_TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing application image tag." >&2
            exit 1
          fi

      - name: Download application image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: luxury-perfume-image-${{ github.sha }}
          path: /tmp

      - name: Load and publish application image artifact
        env:
          IMAGE_TAG: ghcr.io/pursite/luxury-perfume:${{ github.sha }}
        run: |
          docker load --input /tmp/luxury-perfume-application.tar
          docker tag luxury-perfume:application "$IMAGE_TAG"
          docker push "$IMAGE_TAG"

  publish-frontend:
    name: Publish frontend image
    needs: [release-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ghcr-frontend-publish-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject an existing frontend image tag
        env:
          IMAGE_TAG: ghcr.io/pursite/luxury-perfume-frontend:${{ github.sha }}
        run: |
          if docker buildx imagetools inspect "$IMAGE_TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing frontend image tag." >&2
            exit 1
          fi

      - name: Download frontend image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: luxury-perfume-frontend-image-${{ github.sha }}
          path: /tmp

      - name: Load and publish frontend image artifact
        env:
          IMAGE_TAG: ghcr.io/pursite/luxury-perfume-frontend:${{ github.sha }}
        run: |
          docker load --input /tmp/luxury-perfume-frontend-application.tar
          revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' luxury-perfume-frontend:application)"
          test "$revision" = "$GITHUB_SHA"
          docker tag luxury-perfume-frontend:application "$IMAGE_TAG"
          docker push "$IMAGE_TAG"
