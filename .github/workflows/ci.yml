name: Test suite

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  default-tests:
    name: SQLite and LocMem
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/requirements.txt
            requirements/requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements/requirements-test.txt

      - name: Run pytest with branch coverage and warnings as errors
        run: python -W error -m pytest

      - name: Lint Python source
        run: python -m ruff check apps config tests

      - name: Run static security checks
        run: python -m bandit -q -r apps config -x 'apps/**/tests/**,config/tests/**'

      - name: Run Django system checks
        run: python manage.py check --settings=config.settings.test

      - name: Check for missing migrations
        run: >-
          python manage.py makemigrations --check --dry-run
          --settings=config.settings.test

  integration-tests:
    name: PostgreSQL and Redis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wine_shop_test
          POSTGRES_USER: wine_shop_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wine_shop_test -d wine_shop_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DJANGO_SETTINGS_MODULE: config.settings.integration
      INTEGRATION_DB_NAME: wine_shop_test
      INTEGRATION_DB_USER: wine_shop_test
      INTEGRATION_DB_HOST: 127.0.0.1
      INTEGRATION_DB_PORT: "5432"
      INTEGRATION_CACHE_REDIS_URL: redis://127.0.0.1:6379/14
      INTEGRATION_SECURITY_REDIS_URL: redis://127.0.0.1:6379/15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/requirements.txt
            requirements/requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements/requirements-test.txt

      - name: Run PostgreSQL and Redis integration tests
        run: >-
          python -m pytest
          -o addopts="--strict-config --strict-markers"
          -m integration
          --ds=config.settings.integration
          -q

      - name: Run Django system checks against PostgreSQL
        run: python manage.py check --settings=config.settings.integration

      - name: Check migrations against PostgreSQL
        run: >-
          python manage.py makemigrations --check --dry-run
          --settings=config.settings.integration

  image:
    name: Application image
    needs: [default-tests, integration-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate production Compose configuration
        env:
          APP_IMAGE: ghcr.io/pursite/wine-shop:compose-validation
        run: >-
          docker compose --env-file docker/env/.env.production.example
          -f docker/docker-compose.yml
          -f docker/docker-compose.prod.yml
          config -q

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: image_metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/pursite/wine-shop
          tags: |
            type=raw,value=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: final
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image_metadata.outputs.tags }}
          labels: ${{ steps.image_metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
