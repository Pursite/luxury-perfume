name: Test suite

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  default-tests:
    name: SQLite and LocMem
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Run pytest with branch coverage
        run: python -m pytest

      - name: Run Django system checks
        run: python manage.py check --settings=config.settings.test

      - name: Check for missing migrations
        run: >-
          python manage.py makemigrations --check --dry-run
          --settings=config.settings.test

  integration-tests:
    name: PostgreSQL and Redis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wine_shop_test
          POSTGRES_USER: wine_shop_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wine_shop_test -d wine_shop_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DJANGO_SETTINGS_MODULE: config.settings.integration
      INTEGRATION_DB_NAME: wine_shop_test
      INTEGRATION_DB_USER: wine_shop_test
      INTEGRATION_DB_HOST: 127.0.0.1
      INTEGRATION_DB_PORT: "5432"
      INTEGRATION_CACHE_REDIS_URL: redis://127.0.0.1:6379/14
      INTEGRATION_SECURITY_REDIS_URL: redis://127.0.0.1:6379/15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Run PostgreSQL and Redis integration tests
        run: >-
          python -m pytest
          -o addopts="--strict-config --strict-markers"
          -m integration
          --ds=config.settings.integration
          -q

      - name: Run Django system checks against PostgreSQL
        run: python manage.py check --settings=config.settings.integration

      - name: Check migrations against PostgreSQL
        run: >-
          python manage.py makemigrations --check --dry-run
          --settings=config.settings.integration
