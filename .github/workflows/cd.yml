name: Deploy production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA for an already published backend and frontend release
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      GHCR_USERNAME: ${{ github.repository_owner }}

    steps:
      - name: Validate deployment configuration
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          : "${VPS_HOST:?Configure the production VPS_HOST environment secret.}"
          : "${VPS_USER:?Configure the production VPS_USER environment secret.}"
          : "${VPS_SSH_PRIVATE_KEY:?Configure the production VPS_SSH_PRIVATE_KEY environment secret.}"
          : "${VPS_KNOWN_HOSTS:?Configure the production VPS_KNOWN_HOSTS environment secret.}"
          : "${GHCR_READ_TOKEN:?Configure the production GHCR_READ_TOKEN environment secret.}"
          VPS_PORT="${VPS_PORT:-22}"
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]] || {
            echo "VPS_PORT must be a valid TCP port." >&2
            exit 1
          }
          (( VPS_PORT >= 1 && VPS_PORT <= 65535 )) || {
            echo "VPS_PORT must be a valid TCP port." >&2
            exit 1
          }
          [[ "$VPS_USER" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "VPS_USER contains unsupported characters." >&2
            exit 1
          }
          [[ "$GHCR_USERNAME" =~ ^[A-Za-z0-9-]+$ ]] || {
            echo "GHCR_USERNAME contains unsupported characters." >&2
            exit 1
          }
          echo "VPS_PORT=$VPS_PORT" >> "$GITHUB_ENV"

      - name: Configure strict SSH host verification
        id: ssh
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          ssh_directory="$RUNNER_TEMP/luxury-perfume-deploy-ssh"
          install -d -m 700 "$ssh_directory"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_directory/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_directory/known_hosts"
          chmod 600 "$ssh_directory/id_ed25519"
          chmod 600 "$ssh_directory/known_hosts"
          echo "directory=$ssh_directory" >> "$GITHUB_OUTPUT"

      - name: Deploy selected commit
        shell: bash
        env:
          DEPLOY_SHA: ${{ inputs.commit_sha || github.sha }}
          SSH_DIRECTORY: ${{ steps.ssh.outputs.directory }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "The workflow did not provide a full commit SHA." >&2
            exit 1
          }

          {
            printf '%s\0' "$GHCR_READ_TOKEN"
            cat <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          project_directory=/srv/luxury-perfume
          test -d "$project_directory/.git"
          cd "$project_directory"
          test -f .env

          exec 9>"$project_directory/.git/deploy.lock"
          if ! flock -n 9; then
            echo "Another production deployment is already running." >&2
            exit 1
          fi

          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "The deployment checkout contains local source changes; refusing to overwrite it." >&2
            exit 1
          fi

          main_ref=refs/remotes/origin/main
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --unshallow origin "+refs/heads/main:$main_ref"
          else
            git fetch --no-tags origin "+refs/heads/main:$main_ref"
          fi
          git fetch --no-tags origin "$DEPLOY_SHA"
          resolved_sha="$(git rev-parse "$DEPLOY_SHA^{commit}")"
          [ "$resolved_sha" = "$DEPLOY_SHA" ]
          git cat-file -e "$DEPLOY_SHA^{commit}"
          git merge-base --is-ancestor "$DEPLOY_SHA" "$main_ref"

          backend_tag="ghcr.io/pursite/luxury-perfume:${DEPLOY_SHA}"
          frontend_tag="ghcr.io/pursite/luxury-perfume-frontend:${DEPLOY_SHA}"
          docker_config_directory="$(mktemp -d)"
          cleanup_registry_auth() {
            unset GHCR_READ_TOKEN
            rm -rf -- "$docker_config_directory"
          }
          trap cleanup_registry_auth EXIT

          printf '%s' "$GHCR_READ_TOKEN" | DOCKER_CONFIG="$docker_config_directory" \
            docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin >/dev/null
          DOCKER_CONFIG="$docker_config_directory" docker pull "$backend_tag"
          DOCKER_CONFIG="$docker_config_directory" docker pull "$frontend_tag"

          backend_image="$(docker image inspect --format '{{index .RepoDigests 0}}' "$backend_tag")"
          frontend_image="$(docker image inspect --format '{{index .RepoDigests 0}}' "$frontend_tag")"
          [[ "$backend_image" =~ ^ghcr\.io/pursite/luxury-perfume@sha256:[0-9a-f]{64}$ ]]
          [[ "$frontend_image" =~ ^ghcr\.io/pursite/luxury-perfume-frontend@sha256:[0-9a-f]{64}$ ]]

          backend_revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$backend_tag")"
          frontend_revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$frontend_tag")"
          [ "$backend_revision" = "$DEPLOY_SHA" ]
          [ "$frontend_revision" = "$DEPLOY_SHA" ]

          cleanup_registry_auth
          trap - EXIT
          export APP_IMAGE="$backend_image"

          git checkout --detach "$DEPLOY_SHA"
          ./scripts/frontend-release.sh prepare "$project_directory" "$DEPLOY_SHA" "$frontend_image"

          compose=(docker compose --env-file .env -f docker/docker-compose.yml -f docker/docker-compose.prod.yml)
          "${compose[@]}" config -q
          "${compose[@]}" up -d --no-build --no-recreate db redis

          dependencies_ready=false
          for attempt in {1..12}; do
            if "${compose[@]}" exec -T db sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' >/dev/null 2>&1 \
              && "${compose[@]}" exec -T redis redis-cli ping >/dev/null 2>&1; then
              dependencies_ready=true
              break
            fi
            sleep 5
          done
          if [ "$dependencies_ready" != true ]; then
            echo "PostgreSQL or Redis did not become ready in time." >&2
            exit 1
          fi

          "${compose[@]}" run --rm --no-deps web python manage.py check --deploy --settings=config.settings.production
          "${compose[@]}" run --rm --no-deps web python manage.py migrate --noinput
          "${compose[@]}" run --rm --no-deps web python manage.py collectstatic --noinput
          "${compose[@]}" up -d --no-build --no-deps --force-recreate web

          web_ready=false
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 5 \
              -H 'Host: shop.exonplus.ir' \
              -H 'X-Forwarded-Proto: https' \
              http://127.0.0.1:8000/health/ready >/dev/null; then
              web_ready=true
              break
            fi
            sleep 5
          done
          if [ "$web_ready" != true ]; then
            echo "The application did not pass its readiness check in time." >&2
            exit 1
          fi

          "${compose[@]}" up -d --no-build --no-deps --force-recreate celery
          celery_container_id="$("${compose[@]}" ps -q celery)"
          test -n "$celery_container_id"
          for sample in 1 2 3 4 5; do
            current_container_id="$("${compose[@]}" ps -q celery)"
            test "$current_container_id" = "$celery_container_id"
            celery_state="$(docker inspect --format '{{.State.Status}} {{.State.Running}} {{.State.Restarting}} {{.RestartCount}}' "$celery_container_id")"
            read -r status running restarting restart_count <<<"$celery_state"
            test "$status" = running
            test "$running" = true
            test "$restarting" = false
            test "$restart_count" = 0
            if [ "$sample" -lt 5 ]; then
              sleep 2
            fi
          done

          exec ./scripts/frontend-release.sh activate "$project_directory" "$DEPLOY_SHA" "$frontend_image"
          REMOTE_SCRIPT
          } | ssh \
            -i "$SSH_DIRECTORY/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIRECTORY/known_hosts" \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "DEPLOY_SHA=$DEPLOY_SHA GHCR_USERNAME=$GHCR_USERNAME bash -c 'IFS= read -r -d \"\" GHCR_READ_TOKEN; export GHCR_READ_TOKEN; source /dev/stdin'"

      - name: Remove temporary SSH material
        if: always()
        shell: bash
        env:
          SSH_DIRECTORY: ${{ steps.ssh.outputs.directory }}
        run: |
          set -Eeuo pipefail
          if [[ -n "$SSH_DIRECTORY" && -d "$SSH_DIRECTORY" ]]; then
            rm -f -- "$SSH_DIRECTORY/id_ed25519" "$SSH_DIRECTORY/known_hosts"
            rmdir -- "$SSH_DIRECTORY" || true
          fi
